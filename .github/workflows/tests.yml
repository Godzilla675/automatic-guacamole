name: Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit tests (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        node: [22]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        # `canvas` is an optionalDependency: ubuntu runners get its prebuilt binary; if that ever
        # fails the install still succeeds and only the texture-related legacy test files would fail.
        run: npm ci

      - name: Syntax check every script
        run: |
          set -e
          for f in js/*.js tests/*.js tests/helpers/*.js scripts/*.js server/*.js; do node --check "$f"; done

      - name: Run the full test suite (one process per file)
        run: npm test -- --jobs 2
